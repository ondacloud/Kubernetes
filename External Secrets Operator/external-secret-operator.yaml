apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: demo
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: SECRETS_MANAGER_NAME
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: SECRETS_MANAGER_NAME
        property: password
    - secretKey: DB_HOST
      remoteRef:
        key: SECRETS_MANAGER_NAME
        property: host
    - secretKey: DB_PORT
      remoteRef:
        key: SECRETS_MANAGER_NAME
        property: port
    - secretKey: DB_DBNAME
      remoteRef:
        key: SECRETS_MANAGER_NAME
        property: dbname