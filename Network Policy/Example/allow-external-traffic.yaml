apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: demo-network-policy
  namespace: demo
spec:
  podSelector:
    matchLabels:
      app: a # 적용할 대상을 지정.
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: 192.168.1.100/32 # CIDR
    # ports:
    #  - protocol: TCP
    #    port: 8080