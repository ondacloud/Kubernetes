kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sysop
  annotations:
    rbac.authorization.kubernetes.io/autoupdate: "true"
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete", "describe"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sysop
subjects:
- kind: Group
  name: sysop
  apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: sysop
  apiGroup: rbac.authorization.k8s.io