apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: <ROLEBINDING_NAME>
  namespace: <NAMESPACE>

roleRef:
  kind: ClusterRole
  name: <CLUSTERROLE_NAME>
  apiGroup: rbac.authorization.k8s.io
  
subjects:
- kind: User
  name: <USER_NAME>
  apiGroup: rbac.authorization.k8s.io

- kind: ServiceAccount
  name: <SERVICEACCOUNT_NAME>
  namespace: <NAMESPACE>

- kind: Group
  name: <GROUP_NAME>
  apiGroup: rbac.authorization.k8s.io