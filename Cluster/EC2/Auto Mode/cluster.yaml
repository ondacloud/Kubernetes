apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: EKS_CLUSTER_NAME
  version: "EKS_CLUSTER_VERSION"
  region: REGION_CODE

cloudWatch:
  clusterLogging:
    enableTypes: ["*"]

iam:
  withOIDC: true
  serviceAccounts:
  - metadata:
      name: aws-load-balancer-controller
      namespace: kube-system
    wellKnownPolicies:
      awsLoadBalancerController: true
  - metadata:
      name: cert-manager
      namespace: cert-manager
    wellKnownPolicies:
      certManager: true

vpc:
  subnets:
    public:
      REGION_CODEa: { id: public_a }
      REGION_CODEb: { id: public_b }
      REGION_CODEc: { id: public_c }
    private:
      REGION_CODEa: { id: private_a }
      REGION_CODEb: { id: private_b }
      REGION_CODEc: { id: private_c }

autoModeConfig:
  enabled: true